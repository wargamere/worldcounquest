name: CI

# Lint, typecheck, test and a static build with the Pages basePath (spec §11.7).
on:
  pull_request:
  push:
    branches: [v5]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /worldcounquest
